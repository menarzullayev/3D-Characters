name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: for f in assets/js/*.js scripts/*.js; do node --check "$f"; done

      - name: Unit and model tests
        run: npm test

      - name: Compiled CSS is up to date
        run: |
          npm run scss
          git diff --exit-code -- assets/css
